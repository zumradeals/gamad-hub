name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/gamad_hub
      - run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/gamad_hub
      - run: npm run test --workspace @gamad-hub/api-core
      - run: npm run build --workspace @gamad-hub/api-core
      - run: npm run build --workspace @gamad-hub/web
