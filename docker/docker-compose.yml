version: '3.9'

networks:
  gamad_internal:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  backups_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: gamad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamad_hub}
      POSTGRES_USER: ${POSTGRES_USER:-gamad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gamad_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamad}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: gamad_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gamad}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-gamad_hub}
      API_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change_this_secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gamad_internal
    expose:
      - "4000"

  core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    container_name: gamad_core
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:4000/api/v1}
    depends_on:
      - api
    networks:
      - gamad_internal
    expose:
      - "3000"
    ports:
      - "3000:3000"

  portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
    container_name: gamad_portal
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:4000/api/v1}
      NEXT_PUBLIC_CORE_URL: ${NEXT_PUBLIC_CORE_URL:-https://hub.gamad.net}
    depends_on:
      - api
    networks:
      - gamad_internal
    expose:
      - "3001"
    ports:
      - "3001:3001"

  nginx:
    image: nginx:1.27-alpine
    container_name: gamad_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - core
      - portal
      - api
    networks:
      - gamad_internal
