services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backups_data:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gamad_internal

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/storage
    networks:
      - gamad_internal

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    env_file:
      - ../.env
    environment:
      # Docker injecte HOSTNAME=container_id ; Next peut s'y fier et ne pas écouter pour le proxy Nginx.
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      INTERNAL_API_URL: http://api:4000/api
    depends_on:
      - api
    networks:
      - gamad_internal

  portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
    env_file:
      - ../.env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3001"
    networks:
      - gamad_internal

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../infra/nginx/${NGINX_CONF_FILE:-gamad-hub.conf}:/etc/nginx/conf.d/default.conf:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - portal
      - web
      - api
    networks:
      - gamad_internal

volumes:
  postgres_data:
  uploads_data:
  backups_data:

networks:
  gamad_internal:
    driver: bridge
