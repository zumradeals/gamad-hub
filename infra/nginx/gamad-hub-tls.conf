# HTTP + HTTPS (Let's Encrypt). Certificat multi-domaines attendu sous :
#   /etc/letsencrypt/live/gamad.net/fullchain.pem
#   /etc/letsencrypt/live/gamad.net/privkey.pem

# ── HTTP : ACME challenge + redirect HTTPS ────────────────────────────────────

server {
  listen 80;
  server_name gamad.net www.gamad.net;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 80;
  server_name hub.gamad.net www.hub.gamad.net;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS : gamad.net (portail public) ───────────────────────────────────────

server {
  listen 443 ssl;
  http2 on;
  server_name gamad.net www.gamad.net;

  ssl_certificate     /etc/letsencrypt/live/gamad.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gamad.net/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 20m;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  location ^~ /api {
    set $upstream_api api;
    proxy_pass http://$upstream_api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $upstream_portal portal;
    proxy_pass http://$upstream_portal:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ── HTTPS : hub.gamad.net (espace souverain) ──────────────────────────────────

server {
  listen 443 ssl;
  http2 on;
  server_name hub.gamad.net www.hub.gamad.net;

  ssl_certificate     /etc/letsencrypt/live/gamad.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gamad.net/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 20m;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  location ^~ /api {
    set $upstream_api api;
    proxy_pass http://$upstream_api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $upstream_core core;
    proxy_pass http://$upstream_core:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
