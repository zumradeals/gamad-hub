# HTTP + HTTPS (Let's Encrypt). Certificat multi-domaines attendu sous :
#   /etc/letsencrypt/live/gamad.net/fullchain.pem
#   /etc/letsencrypt/live/gamad.net/privkey.pem
# (premier -d de certbot = nom du dossier live/<nom>/).
#
# Déploiement Docker : dans .env, NGINX_CONF_FILE=gamad-hub-tls.conf
# et fusionner docker/docker-compose.tls.yml pour monter les volumes TLS + webroot.
#
# Exemple Certbot (HTTP-01, Nginx sur le VPS déjà sur le port 80) :
#   certbot certonly --webroot -w /var/www/certbot \
#     -d gamad.net -d www.gamad.net -d hub.gamad.net -d www.hub.gamad.net

server {
  listen 80;
  listen 443 ssl;
  http2 on;
  server_name gamad.net www.gamad.net;

  ssl_certificate     /etc/letsencrypt/live/gamad.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gamad.net/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 20m;

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location ^~ /api {
    set $upstream_api api;
    proxy_pass http://$upstream_api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $upstream_portal portal;
    proxy_pass http://$upstream_portal:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  listen 443 ssl;
  http2 on;
  server_name hub.gamad.net www.hub.gamad.net;

  ssl_certificate     /etc/letsencrypt/live/gamad.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gamad.net/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 20m;

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location ^~ /api {
    set $upstream_api api;
    proxy_pass http://$upstream_api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $upstream_web web;
    proxy_pass http://$upstream_web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
