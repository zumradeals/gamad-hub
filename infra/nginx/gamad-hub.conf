# Résolution DNS au moment de la requête (Docker 127.0.0.11) : évite les 502 après
# recréation des conteneurs web/portal alors que nginx n’a pas été redémarré (IP obsolète).

server {
  listen 80;
  server_name gamad.net www.gamad.net;

  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 20m;

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  location /api/ {
    set $upstream_api api;
    proxy_pass http://$upstream_api:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $upstream_portal portal;
    proxy_pass http://$upstream_portal:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
